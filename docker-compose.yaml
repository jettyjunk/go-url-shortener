services:
  shortener-postgres:
    image: postgres:18.3-bookworm
    container_name: shortener-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./out/pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    restart: always